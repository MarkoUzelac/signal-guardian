name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: signal-guardian-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, lint, type-check, tests, and security audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release policy is present
        run: test -s AGENT_RELIABILITY.md

      - name: Apply non-breaking npm lockfile security updates
        id: lockfile_fix
        run: npm audit fix --package-lock-only --no-fund

      - name: Install the exact reconciled lockfile
        id: install
        if: ${{ always() && steps.lockfile_fix.outcome == 'success' }}
        run: npm ci --no-audit --no-fund

      - name: Lint
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Type-check application
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npx tsc --noEmit --project tsconfig.app.json

      - name: Type-check Vite configuration
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npx tsc --noEmit --project tsconfig.node.json

      - name: Unit tests
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Audit production dependencies
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm audit --omit=dev --audit-level=high

      - name: Build production bundle
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          npm run build
          test -s dist/index.html

      - name: Publish reconciled npm lockfile for review
        if: ${{ always() && hashFiles('package-lock.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: signal-guardian-package-lock-${{ github.run_id }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
