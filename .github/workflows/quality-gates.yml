name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: signal-guardian-quality-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, lint, type-check, tests, and security audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the exact source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release policy is present
        run: test -s AGENT_RELIABILITY.md

      - name: Reconcile npm lockfile for same-repository pull requests
        id: lockfile
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: npm audit fix --package-lock-only --no-fund

      - name: Commit reconciled lockfile and dispatch verification for new commit
        id: commit_lockfile
        if: ${{ always() && steps.lockfile.outcome == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi

          git add package-lock.json
          git commit -m "chore: reconcile npm lockfile"
          git push origin "HEAD:${TARGET_BRANCH}"



      - name: Install exact reconciled lockfile
        id: install
        if: ${{ always() && (steps.lockfile.outcome == 'success' || steps.lockfile.outcome == 'skipped') }}
        run: npm ci --no-audit --no-fund

      - name: Lint
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Type-check application
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npx tsc --noEmit --project tsconfig.app.json

      - name: Type-check Vite configuration
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npx tsc --noEmit --project tsconfig.node.json

      - name: Unit tests
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Audit all dependencies
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm audit --audit-level=high

      - name: Audit production dependencies
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm audit --omit=dev --audit-level=high

      - name: Build production bundle
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          npm run build
          test -s dist/index.html

      - name: Capture exact lockfile used by this run
        if: ${{ always() && hashFiles('package-lock.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: signal-guardian-package-lock-${{ github.run_id }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
